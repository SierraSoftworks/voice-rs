# Helldivers 2 — voice-orders profile
#
# Every stratagem in the game, taken from https://helldivers.wiki.gg/wiki/Stratagems.
# Stratagem inputs are the arrow keys; each command speaks the stratagem's natural
# name, without its equipment designation ("autocannon", not "AC-8 Autocannon").
# Unlike LinVAM, voice-orders supports ambiguous prefixes, so the sentry call-ins
# use their natural order ("auto cannon sentry", not "sentry auto cannon"): saying
# "auto cannon" alone calls the support weapon after the completion timeout, and
# continuing with "sentry" calls the sentry instead.
#
# Where a name is a compound the speech model has never heard — "autocannon",
# "hellbomb", "meltagun" — the spoken literal splits it into words the model does
# know and the rule's TitleCase name carries the real spelling into the logs and
# the validate report.
#
# TitleCase rules are published as speakable commands; `"word"?` may be left
# unsaid, and `("either" | "or")` groups the alternatives — the v2 spellings of
# the old `[optional]` and `{alternate, choices}` forms.
#
# Play with: voice-orders run profiles/helldivers2.yaml -- %command%
name: Helldivers 2
model: ~/.local/share/vosk/vosk-model-en-us-0.22-lgraph

hotkey:
  device: auto
  key: leftctrl
  mode: push-to-talk

completion_timeout: 500ms

defaults:
  duration: 30ms
  interval: 30ms

recognition:
  eager: true
  eager_delay: 50ms

grammar: |
  // ── Mission stratagems: ship ──────────────────────────────────────────
  Reinforce = "reinforce" | "reinforcements" | "call in reinforcements" { up, down, right, left, up }
  Resupply = "resupply" | "supplies" { down, down, up, right }
  Rearm = "eagle"? "rearm" { up, up, left, up, right }
  SuperDestroyer = "call in"? "super destroyer" { up, up, down, down, left, right, left, right }
  SosBeacon = "sos beacon" { up, down, right, up }

  // ── Mission stratagems: objectives ────────────────────────────────────
  Hellbomb = "hell bomb" { down, up, left, down, up, right, down, up }
  CargoContainer = "cargo container" { up, up, down, down, right, down }
  ProspectingDrill = "prospecting drill" { down, down, left, right, down, down }
  SeafArtillery = "artillery" { right, up, up, down }
  SeismicProbe = "seismic probe" { up, up, left, right, down, down }
  SssdDelivery = "ssd" | "hard drive" { down, down, down, down, down, up, up }
  Flag = "raise"? "super earth"? "flag" { down, up, down, up }
  TectonicDrill = "tectonic drill" { up, down, up, down, up, down }
  UploadData = "upload data" | "reinforcement pods" { left, right, up, up, up }
  HiveBreakerDrill = "hive breaker drill" { left, up, down, right, down, down }
  DarkFluidVessel = "dark fluid vessel" { up, left, right, down, up, up }
  TacticalVideoCamera = "tactical video camera" { right, down, down, up, left, left, up }
  AquiferDrill = "aquifer drill" { left, left, left, up, down, right, down, down }
  CommsRelay = "portable"? "comms relay" { up, up, down, down, left, left, down }

  // Mission-issued only: no permit buys this one.
  IlluminationFlare = "orbital"? "illumination flare" { right, right, left, left }

  // ── Support weapons ───────────────────────────────────────────────────
  MachineGun = "machine gun" { down, left, down, up, right }
  Stalwart = "stalwart" { down, left, down, up, up, left }
  HeavyMachineGun = "heavy machine gun" { down, left, up, down, down }
  BulletStorm = "bullet storm" { down, left, down, right, up, left }
  Maxigun = "maxi gun" { down, left, right, down, up, up }
  AntiMaterielRifle = "anti" ("materiel" | "material") "rifle" { down, left, right, up, down }
  Autocannon = "auto cannon" { down, left, down, up, up, right }
  LaserCannon = "laser cannon" { down, left, down, up, left }
  QuasarCannon = "quasar cannon" { down, down, up, left, right }
  Railgun = "rail gun" { down, right, down, up, left, right }
  RecoillessRifle = "recoil less rifle" | "recoil rifle" { down, left, right, right, left }
  ExpendableAntiTank = "expendable anti tank" { down, down, left, up, right }
  ExpendableNapalm = "expendable napalm" { down, down, left, up, left }
  Leveller = "leveller" { down, down, left, up, down }
  Spear = "spear" { down, down, up, down, down }
  WaspLauncher = "wasp" "launcher"? { down, down, up, down, right }
  Commando = "commando" { down, left, up, down, right }
  AirburstRocketLauncher = "airburst rocket launcher" { down, up, up, left, right }
  GrenadeLauncher = "grenade launcher" { down, left, up, left, down }
  BeltFedGrenadeLauncher = "belt fed grenade launcher" { down, left, up, left, up, up }
  ArcThrower = "arc thrower" { down, right, down, up, left, left }
  Speargun = "speargun" { down, right, down, left, up, right }
  FlameThrower = "flame thrower" { down, left, up, down, up }
  Sterilizer = "sterilizer" { down, left, up, down, left }
  Cremator = "crema tor" | "cremate or" { down, down, right, down, up, up }
  Meltagun = "melt a gun" { down, left, up, left, left, down }
  Epoch = "epoch" { down, left, up, left, right }
  DeEscalator = "de escalator" { down, right, up, left, right }
  C4Pack = "c four pack" { down, right, up, up, right, up }
  SoloSilo = "solo silo" { down, up, right, down, down }
  OneTrueFlag = "one true flag" { down, left, right, right, up }
  BreachingHammer = "breaching hammer" { down, left, right, left, up }
  DefoliationTool = "defoliation tool" { down, left, right, right, down }

  // ── Backpacks ─────────────────────────────────────────────────────────
  GuardDog = "guard dog" { down, up, left, up, right, down }
  Rover = "guard dog"? "rover" { down, up, left, up, right, right }
  K9 = "guard dog"? ("k nine" | "canine") { down, up, left, up, right, left }
  HotDog = "guard dog"? "hot dog" { down, up, left, up, left, left }
  DogBreath = "guard dog"? "dog breath" { down, up, left, up, right, up }
  SupplyPack = "supply pack" { down, left, down, up, up, down }
  JumpPack = "jump pack" { down, up, up, down, up }
  HoverPack = "hover pack" { down, up, up, down, left, right }
  WarpPack = "warp pack" { down, left, right, down, left, right }
  ShieldPack = "shield" "generator"? "pack" { down, up, left, right, left, right }
  BallisticShield = "ballistic shield" "backpack"? { down, left, down, down, up, left }
  DirectionalShield = "directional shield" { down, up, left, right, up, up }
  PortableHellbomb = "portable hell bomb" { down, right, up, up, up }

  // ── Vehicles ──────────────────────────────────────────────────────────
  Patriot = "patriot" "exo suit"? { left, down, right, up, left, down, down }
  Emancipator = "emancipator" "exo suit"? { left, down, right, up, left, down, up }
  Lumberer = "lumberer" "exo suit"? { left, down, right, up, right, left, up }
  Breakthrough = "breakthrough" "exo suit"? { left, down, right, left, right, down, up }
  GunnerFrv = "gunner" ("f r v" | "buggy") { left, down, right, down, right, down, up }
  SupplyFrv = "supply" ("f r v" | "buggy") { left, down, left, left, down, up, right }
  IncineratorFrv = "incinerator" ("f r v" | "buggy") { left, down, right, left, down, up, up }
  Bastion = "tank" | "bastion" { left, down, right, down, left, down, up, down, up }

  // ── Orbitals ──────────────────────────────────────────────────────────
  PrecisionStrike = "orbital"? "precision strike" { right, right, up }
  GatlingBarrage = "orbital"? "gatling barrage" { right, down, left, up, up }
  AirburstStrike = "orbital"? "air burst" "strike"? { right, right, right }
  GasStrike = "orbital"? "gas strike" { right, right, down, right }
  OrbitalEmsStrike = "orbital"? "ems" "strike"? { right, right, left, down }
  SmokeStrike = "orbital"? "smoke" "strike"? { right, right, down, up }
  OneTwentyBarrage = "orbital"? ("one twenty" | "one hundred twenty") "millimeter"? "barrage" { right, right, down, left, right, down }
  WalkingBarrage = "orbital"? "walking barrage" { right, down, right, down, right, down }
  ThreeEightyBarrage = "orbital"? ("three eighty" | "three hundred eighty") "millimeter"? "barrage" { right, down, up, up, left, down, down }
  NapalmBarrage = "orbital"? "napalm barrage" { right, right, down, left, right, up }
  RailcannonStrike = "orbital"? "rail cannon" "strike"? { right, up, down, down, right }
  OrbitalLaser = "orbital laser" { right, down, up, right, down }

  // ── Eagles ────────────────────────────────────────────────────────────
  StrafingRun = "eagle"? "strafing run" { up, right, right }
  Airstrike = "eagle"? "airstrike" { up, right, down, right }
  ClusterBomb = "eagle"? "cluster bomb" { up, right, down, down, right }
  EagleNapalm = "eagle" "napalm" ("strike" | "airstrike")? { up, right, down, up }
  EagleSmoke = "eagle" "smoke" "strike"? { up, right, up, down }
  RocketPods = "eagle"? ("one ten" | "one hundred ten") "millimeter"? "rocket pods" { up, right, up, left }
  FiveHundredKilo = "eagle"? "five hundred" "kilo"? "bomb"? { up, right, down, down, down }

  // ── Sentries (natural order — ambiguous with the support weapons) ─────
  MachineGunSentry = "machine gun sentry" { down, up, right, right, up }
  GatlingSentry = "gatling sentry" { down, up, right, left }
  AutocannonSentry = "auto cannon sentry" { down, up, right, up, left, up }
  MortarSentry = "mortar sentry" { down, up, right, right, down }
  EmsMortarSentry = "ems mortar sentry" { down, up, right, down, right }
  GasMortarSentry = "gas mortar sentry" { down, up, right, down, left }
  RocketSentry = "rocket sentry" { down, up, right, right, left }
  TeslaTower = "tesla tower" { down, up, right, up, left, right }
  LaserSentry = "laser sentry" { down, up, right, down, up, right }
  FlameSentry = "flame sentry" { down, up, right, down, up, up }

  // ── Emplacements & mines ──────────────────────────────────────────────
  AntiPersonnelMines = "anti personnel" ("mines" | "minefield") { down, left, up, right }
  AntiTankMines = "anti tank" ("mines" | "minefield") { down, left, up, up }
  IncendiaryMines = "incendiary" ("mines" | "minefield") { down, left, left, down }
  GasMines = "gas" ("mines" | "minefield") { down, left, left, right }
  ShieldRelay = "shield" "generator"? "relay" { down, down, left, right, left, right }
  GrenadierBattlement = "grenadier battlement" { down, right, down, left, right }
  HmgEmplacement = "heavy"? "machine gun emplacement" { down, up, left, right, right, left }
  AntiTankEmplacement = "anti tank emplacement" { down, up, left, right, right, right }
