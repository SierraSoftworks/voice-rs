[package]
name = "voice-orders"
version = "0.1.0"
edition = "2024"
description = "A Linux-native voice macro tool: speak a phrase, press the keys."
license = "MIT"
repository = "https://github.com/SierraSoftworks/voice-rs"

[dependencies]
ariadne = "0.6"
chumsky = "0.13"
clap = { version = "4.6", features = ["derive"] }
cpal = "0.16"
human-errors = { version = "0.2.3", features = ["pretty"] }
humantime = "2.1"
libloading = "0.9"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
shellexpand = "3.1"
strsim = "0.11"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing-batteries = { git = "https://github.com/sierrasoftworks/tracing-batteries-rs.git", features = ["opentelemetry"] }
update-rs = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.13", features = ["tokio"] }
libc = "0.2"
uinput-tokio = "0.1.36"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",                    # GetTokenInformation (integrity-level doctor report)
    "Win32_System_Console",              # GenerateConsoleCtrlEvent
    "Win32_System_JobObjects",           # CreateJobObjectW, KILL_ON_JOB_CLOSE
    "Win32_System_SystemInformation",    # GetLocalTime (TUI clock)
    "Win32_System_Threading",            # GetCurrentThreadId, OpenProcessToken
    "Win32_UI_Input_KeyboardAndMouse",   # SendInput, KEYBDINPUT, KEYEVENTF_*, VK_*
    "Win32_UI_WindowsAndMessaging",      # SetWindowsHookExW, GetMessageW, KBDLLHOOKSTRUCT
] }

[dev-dependencies]
rstest = "0.26.1"
tokio = { version = "1.50", features = ["test-util"] }
tempfile = "3"
wiremock = "0.6.2"

[features]
default = []
# Gates tests which require external resources (a Vosk model, audio hardware,
# or real /dev/uinput access): `cargo test --features pure_tests` skips them.
pure_tests = []

[profile.release]
debug = false
strip = "debuginfo"
