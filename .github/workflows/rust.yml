name: Rust
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

env:
  VERSION: "0.0.0-dev"

  # libvosk is loaded with dlopen at runtime rather than linked, so only the
  # jobs which *run* recognition (test) or *ship* the library (build) need it.
  # Bump these two together.
  VOSK_VERSION: "0.3.45"
  VOSK_MODEL: "vosk-model-small-en-us-0.15"

jobs:
  version:
    name: Start Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Generate Package Version (Release Tag)
        shell: pwsh
        if: github.event_name == 'release'
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$('${{ github.event.release.tag_name }}'.substring(1))"

      - name: Set Package Version
        run: sed -i "s/^version\s*=\s*\".*\"/version = \"$VERSION\"/g" Cargo.toml

      - name: Stash Versioned Cargo.toml
        uses: actions/upload-artifact@v7
        with:
          name: cargofile
          path: Cargo.toml

  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      # cpal's ALSA host needs the ALSA headers, and uinput-tokio pulls in
      # libudev-sys, whose build script shells out to pkg-config for libudev.
      # libvosk is deliberately absent: it is dlopen'd at runtime rather than
      # linked, so nothing here needs it to compile.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  check-windows:
    name: Check (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      # Nothing to install: cpal uses WASAPI (in the OS), evdev/uinput are not
      # in the dependency tree at all on Windows, and libvosk is loaded with
      # LoadLibrary at runtime rather than linked — so there is no DLL to fetch
      # in order to *compile*.
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      # The same suite the Linux job runs, and for the same reason: the tests
      # which need a Vosk model, a microphone or a real virtual keyboard are
      # gated behind `pure_tests`, which is what makes them skip on a runner
      # that has none of the three. Nothing links libvosk (it is loaded with
      # LoadLibrary at runtime), so there is no DLL to install to compile or to
      # run these.
      #
      # No coverage instrumentation here: grcov's report is uploaded from the
      # Linux job, and the point of this one is that the *behaviour* is the same
      # on both platforms.
      - name: Run tests
        run: cargo test --features pure_tests --no-fail-fast

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Cache libvosk
        uses: actions/cache@v6
        with:
          path: ~/.cache/vosk/lib
          key: libvosk-x86_64-${{ env.VOSK_VERSION }}

      - name: Install libvosk
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/vosk/lib"
          dir="$root/vosk-linux-x86_64-${VOSK_VERSION}"
          if [ ! -f "$dir/libvosk.so" ]; then
            mkdir -p "$root"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/libvosk.zip \
              "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_VERSION}/vosk-linux-x86_64-${VOSK_VERSION}.zip"
            unzip -q -o /tmp/libvosk.zip -d "$root"
          fi
          test -f "$dir/libvosk.so"
          # VOSK_LIB_PATH is what voice-orders itself consults first;
          # LD_LIBRARY_PATH covers anything else which dlopen's the bare SONAME.
          {
            echo "VOSK_LIB_PATH=$dir/libvosk.so"
            echo "LD_LIBRARY_PATH=$dir"
          } >> "$GITHUB_ENV"

      # Only the test job needs an actual acoustic model (~40MB). Tests which
      # need one read VOSK_MODEL_PATH and skip themselves when it is unset, so
      # this is the single place the model has to exist.
      - name: Cache Vosk model
        uses: actions/cache@v6
        with:
          path: ~/.cache/vosk/models
          key: vosk-model-${{ env.VOSK_MODEL }}

      - name: Install Vosk model
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/vosk/models"
          # The model zip likewise contains a single directory named after the
          # model, which is the path the vosk API expects to be handed.
          dir="$root/${VOSK_MODEL}"
          if [ ! -d "$dir" ]; then
            mkdir -p "$root"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/vosk-model.zip \
              "https://alphacephei.com/vosk/models/${VOSK_MODEL}.zip"
            unzip -q -o /tmp/vosk-model.zip -d "$root"
          fi
          test -d "$dir"
          echo "VOSK_MODEL_PATH=$dir" >> "$GITHUB_ENV"

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo install grcov
        uses: SierraSoftworks/setup-grcov@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The runner has no microphone, no membership of the `input` group and no
      # writable /dev/uinput, so the tests which need real hardware or a Vosk
      # model are gated behind `pure_tests` and skipped here.
      - name: Run tests
        run: cargo test --features pure_tests --no-fail-fast
        env:
            RUSTFLAGS: -Cinstrument-coverage
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The gated tests are advisory: the model-driven ones depend on
      # recognition behaviour we don't yet pin, and the hardware-driven ones
      # cannot pass on a runner at all, so a failure here shouldn't redden an
      # otherwise good build. Flip continue-on-error off once they're
      # trustworthy and the hardware ones have somewhere real to run.
      - name: Run model-gated tests
        continue-on-error: true
        run: cargo test --features pure_tests -- --ignored --no-fail-fast
        env:
            RUSTFLAGS: -Cinstrument-coverage
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: grcov
        run: grcov . --binary-path target/debug/deps/ -s . -t lcov --ignore-not-existing --ignore '../**' --ignore '/*' --ignore 'C:/' -o ./lcov.info

      - name: codecov upload
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}-release
    runs-on: ${{ matrix.run_on }}

    needs:
      - version

    strategy:
      matrix:
        include:
          # Every row builds natively on a runner of its own architecture and
          # operating system, which keeps the headers, libvosk and the linker
          # all in the same place rather than juggling them across a cross
          # container. macOS is still deliberately absent: there is no output
          # backend for it.
          #
          # `rustflags` is per-row because the rpath the Linux rows need is a
          # GNU-ld flag which the MSVC linker would reject outright.
          - arch: amd64
            os: linux
            run_on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            vosk_arch: x86_64
            rustflags: "-C link-args=-Wl,-rpath,$ORIGIN,-rpath,$ORIGIN/../lib,-rpath,$ORIGIN/../../../../lib"
          - arch: arm64
            os: linux
            run_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            vosk_arch: aarch64
            rustflags: "-C link-args=-Wl,-rpath,$ORIGIN,-rpath,$ORIGIN/../lib,-rpath,$ORIGIN/../../../../lib"
          - arch: amd64
            os: windows
            run_on: windows-latest
            target: x86_64-pc-windows-msvc
            vosk_arch: win64
            rustflags: ""

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Get Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Install build dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Cache libvosk
        uses: actions/cache@v6
        with:
          path: ~/.cache/vosk/lib
          key: libvosk-${{ matrix.vosk_arch }}-${{ env.VOSK_VERSION }}

      - name: Install libvosk
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/vosk/lib"
          # vosk-linux-<arch>-<version>.zip unpacks to a directory of the same
          # name holding libvosk.so. Nothing links against it any more; the
          # build job fetches it purely so the release can publish it.
          dir="$root/vosk-linux-${{ matrix.vosk_arch }}-${VOSK_VERSION}"
          if [ ! -f "$dir/libvosk.so" ]; then
            mkdir -p "$root"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/libvosk.zip \
              "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_VERSION}/vosk-linux-${{ matrix.vosk_arch }}-${VOSK_VERSION}.zip"
            unzip -q -o /tmp/libvosk.zip -d "$root"
          fi
          test -f "$dir/libvosk.so"
          echo "VOSK_LIB_DIR=$dir" >> "$GITHUB_ENV"

      # The Windows build of libvosk is a MinGW one, so it arrives with the
      # three runtime DLLs it imports. All four have to travel together — the
      # loader flag voice-orders uses (LOAD_WITH_ALTERED_SEARCH_PATH) looks for
      # them beside libvosk.dll — so all four are asserted here rather than
      # discovered missing by somebody's game launch.
      - name: Install libvosk (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/vosk/lib"
          dir="$root/vosk-win64-${VOSK_VERSION}"
          if [ ! -f "$dir/libvosk.dll" ]; then
            mkdir -p "$root"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/libvosk.zip \
              "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_VERSION}/vosk-win64-${VOSK_VERSION}.zip"
            unzip -q -o /tmp/libvosk.zip -d "$root"
          fi
          for dll in libvosk.dll libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            test -f "$dir/$dll" || { echo "vosk-win64-${VOSK_VERSION} is missing $dll" >&2; exit 1; }
          done
          echo "VOSK_LIB_DIR=$dir" >> "$GITHUB_ENV"

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Fetch Versioned Cargo.toml
        uses: actions/download-artifact@v8
        with:
          name: cargofile

      # On Linux, libvosk.so is dlopen'd by name and dlopen searches the calling
      # binary's RUNPATH — so the rpath is what lets an installed voice-orders
      # find the library in each layout the release assets end up in:
      #   $ORIGIN                    - the two files unpacked side by side
      #   $ORIGIN/../lib             - a `bin`/`lib` prefix such as /usr/local
      #   $ORIGIN/../../../../lib    - $HOMEBREW_PREFIX/lib, four levels up from
      #                                Cellar/voice-orders/<version>/bin
      # A single -Wl argument carries all three because RUSTFLAGS is split on
      # spaces, so each entry has to be comma-separated rather than a flag of
      # its own. It comes from the matrix because it is a GNU-ld flag: Windows
      # needs no equivalent (a DLL is looked for beside the .exe first) and the
      # MSVC linker would reject it, so that row's `rustflags` is empty.
      - name: cargo build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # Release assets are published raw rather than as a tarball so they can be
      # dropped straight onto a PATH, and so the Homebrew tap (which downloads
      # and hashes a single binary named {app}-{os}-{arch}) can consume them.
      # libvosk.so travels as its own asset for the same reason.
      - name: Stage release artifacts
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/voice-orders" "voice-orders-${{ matrix.os }}-${{ matrix.arch }}"
          cp "${VOSK_LIB_DIR}/libvosk.so" "libvosk-${{ matrix.os }}-${{ matrix.arch }}.so"
          chmod +x "voice-orders-${{ matrix.os }}-${{ matrix.arch }}"

      # Windows ships twice, because two different things download it:
      #
      #   voice-orders-windows-amd64.exe  the raw binary, which is the asset
      #                                   `voice-orders update` looks for — the
      #                                   name is update-rs' Go-style
      #                                   convention (`naming::go`), including
      #                                   the `.exe`, and src/update.rs pins it.
      #   voice-orders-windows-amd64.zip  the binary and the four libvosk DLLs
      #                                   side by side, which is the layout a
      #                                   person wants: unzip it anywhere and it
      #                                   works, because Windows looks for a
      #                                   DLL in the executable's own directory
      #                                   first.
      #
      # 7-Zip rather than `zip`, which the Windows runner image does not have.
      - name: Stage release artifacts (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="voice-orders-${{ matrix.os }}-${{ matrix.arch }}"
          built="target/${{ matrix.target }}/release/voice-orders.exe"

          cp "$built" "${asset}.exe"

          mkdir -p "$asset"
          cp "$built" "$asset/voice-orders.exe"
          for dll in libvosk.dll libstdc++-6.dll libgcc_s_seh-1.dll libwinpthread-1.dll; do
            cp "${VOSK_LIB_DIR}/$dll" "$asset/"
          done
          7z a -tzip -bso0 "${asset}.zip" "./$asset/*"

          test -f "${asset}.exe"
          test -f "${asset}.zip"

      - name: Upload GitHub Release Artifacts
        uses: SierraSoftworks/gh-releases@v1.0.10
        if: github.event_name == 'release' && matrix.os == 'linux'
        with:
          files: |
            voice-orders-${{ matrix.os }}-${{ matrix.arch }}
            libvosk-${{ matrix.os }}-${{ matrix.arch }}.so
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: "true"

      - name: Upload GitHub Release Artifacts (Windows)
        uses: SierraSoftworks/gh-releases@v1.0.10
        if: github.event_name == 'release' && matrix.os == 'windows'
        with:
          files: |
            voice-orders-${{ matrix.os }}-${{ matrix.arch }}.exe
            voice-orders-${{ matrix.os }}-${{ matrix.arch }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: "true"

      - name: Upload build artifacts
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: voice-orders-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            voice-orders-${{ matrix.os }}-${{ matrix.arch }}
            libvosk-${{ matrix.os }}-${{ matrix.arch }}.so

      - name: Upload build artifacts (Windows)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: voice-orders-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            voice-orders-${{ matrix.os }}-${{ matrix.arch }}.exe
            voice-orders-${{ matrix.os }}-${{ matrix.arch }}.zip

  # Fan in once every target's assets are published, so the tap never holds a
  # formula which only covers half the platforms. The repository is `voice-rs`
  # but the binary (and therefore the formula and asset prefix) is
  # `voice-orders`, hence the explicit name.
  #
  # The Windows row is fanned in here too — `needs` names a job, not a matrix
  # row — but it contributes nothing: with no `os`/`arch` input the action scans
  # the platforms Homebrew has, and the Windows assets are neither named
  # `voice-orders-{os}-{arch}` nor a platform it looks for.
  tap:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs:
      - build
    steps:
      - name: Update Homebrew Tap
        uses: SierraSoftworks/actions-tap@v1
        with:
          name: voice-orders
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aliases: major minor
