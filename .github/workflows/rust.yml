name: Rust
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

env:
  VERSION: "0.0.0-dev"

  # vosk-sys links libvosk.so dynamically and there is no crates.io fallback,
  # so every job which compiles this crate has to fetch the prebuilt library
  # first. Bump these two together with the `vosk` crate.
  VOSK_VERSION: "0.3.45"
  VOSK_MODEL: "vosk-model-small-en-us-0.15"

jobs:
  version:
    name: Start Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Generate Package Version (Release Tag)
        shell: pwsh
        if: github.event_name == 'release'
        run: Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$('${{ github.event.release.tag_name }}'.substring(1))"

      - name: Set Package Version
        run: sed -i "s/^version\s*=\s*\".*\"/version = \"$VERSION\"/g" Cargo.toml

      - name: Stash Versioned Cargo.toml
        uses: actions/upload-artifact@v7
        with:
          name: cargofile
          path: Cargo.toml

  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      # cpal's ALSA host needs the ALSA headers, and uinput-tokio pulls in
      # libudev-sys, whose build script shells out to pkg-config for libudev.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Cache libvosk
        uses: actions/cache@v6
        with:
          path: ~/.cache/vosk/lib
          key: libvosk-x86_64-${{ env.VOSK_VERSION }}

      - name: Install libvosk
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/vosk/lib"
          # The zip holds a single directory, vosk-linux-<arch>-<version>/,
          # containing libvosk.so and vosk_api.h. Unzipping into `root` yields
          # `$root/vosk-linux-x86_64-<version>` and *that* is the directory the
          # linker and loader need on their search paths.
          dir="$root/vosk-linux-x86_64-${VOSK_VERSION}"
          if [ ! -f "$dir/libvosk.so" ]; then
            mkdir -p "$root"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/libvosk.zip \
              "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_VERSION}/vosk-linux-x86_64-${VOSK_VERSION}.zip"
            unzip -q -o /tmp/libvosk.zip -d "$root"
          fi
          test -f "$dir/libvosk.so"
          {
            echo "VOSK_LIB_DIR=$dir"
            echo "LIBRARY_PATH=$dir"
            echo "LD_LIBRARY_PATH=$dir"
          } >> "$GITHUB_ENV"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Cache libvosk
        uses: actions/cache@v6
        with:
          path: ~/.cache/vosk/lib
          key: libvosk-x86_64-${{ env.VOSK_VERSION }}

      - name: Install libvosk
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/vosk/lib"
          dir="$root/vosk-linux-x86_64-${VOSK_VERSION}"
          if [ ! -f "$dir/libvosk.so" ]; then
            mkdir -p "$root"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/libvosk.zip \
              "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_VERSION}/vosk-linux-x86_64-${VOSK_VERSION}.zip"
            unzip -q -o /tmp/libvosk.zip -d "$root"
          fi
          test -f "$dir/libvosk.so"
          {
            echo "VOSK_LIB_DIR=$dir"
            echo "LIBRARY_PATH=$dir"
            echo "LD_LIBRARY_PATH=$dir"
          } >> "$GITHUB_ENV"

      # Only the test job needs an actual acoustic model (~40MB). Tests which
      # need one read VOSK_MODEL_PATH and skip themselves when it is unset, so
      # this is the single place the model has to exist.
      - name: Cache Vosk model
        uses: actions/cache@v6
        with:
          path: ~/.cache/vosk/models
          key: vosk-model-${{ env.VOSK_MODEL }}

      - name: Install Vosk model
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/vosk/models"
          # The model zip likewise contains a single directory named after the
          # model, which is the path the vosk API expects to be handed.
          dir="$root/${VOSK_MODEL}"
          if [ ! -d "$dir" ]; then
            mkdir -p "$root"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/vosk-model.zip \
              "https://alphacephei.com/vosk/models/${VOSK_MODEL}.zip"
            unzip -q -o /tmp/vosk-model.zip -d "$root"
          fi
          test -d "$dir"
          echo "VOSK_MODEL_PATH=$dir" >> "$GITHUB_ENV"

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo install grcov
        uses: SierraSoftworks/setup-grcov@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: cargo test --no-fail-fast
        env:
            RUSTFLAGS: -Cinstrument-coverage
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Model-gated tests are advisory until they've stabilised in CI: they
      # depend on a real acoustic model and on recognition behaviour we don't
      # yet pin, so a failure here shouldn't redden an otherwise good build.
      # Flip continue-on-error off once they're trustworthy.
      - name: Run model-gated tests
        continue-on-error: true
        run: cargo test -- --ignored --no-fail-fast
        env:
            RUSTFLAGS: -Cinstrument-coverage
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: grcov
        run: grcov . --binary-path target/debug/deps/ -s . -t lcov --ignore-not-existing --ignore '../**' --ignore '/*' --ignore 'C:/' -o ./lcov.info

      - name: codecov upload
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}-release
    runs-on: ${{ matrix.run_on }}

    needs:
      - version

    strategy:
      matrix:
        include:
          # Linux builds only - the evdev/uinput layer is deliberately
          # Linux-first, so there are no Windows or macOS targets.
          - arch: amd64
            os: linux
            run_on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            vosk_arch: x86_64
            builder: cargo
          - arch: arm64
            os: linux
            run_on: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            vosk_arch: aarch64
            builder: cross

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Get Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Cache libvosk
        uses: actions/cache@v6
        with:
          path: ~/.cache/vosk/lib
          key: libvosk-${{ matrix.vosk_arch }}-${{ env.VOSK_VERSION }}

      - name: Install libvosk
        shell: bash
        run: |
          set -euo pipefail
          root="$HOME/.cache/vosk/lib"
          # vosk-linux-<arch>-<version>.zip unpacks to a directory of the same
          # name holding libvosk.so - point the linker at that directory, and
          # keep its path around so the release tarball can bundle the .so.
          dir="$root/vosk-linux-${{ matrix.vosk_arch }}-${VOSK_VERSION}"
          if [ ! -f "$dir/libvosk.so" ]; then
            mkdir -p "$root"
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/libvosk.zip \
              "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_VERSION}/vosk-linux-${{ matrix.vosk_arch }}-${VOSK_VERSION}.zip"
            unzip -q -o /tmp/libvosk.zip -d "$root"
          fi
          test -f "$dir/libvosk.so"
          {
            echo "VOSK_LIB_DIR=$dir"
            echo "LIBRARY_PATH=$dir"
            echo "LD_LIBRARY_PATH=$dir"
          } >> "$GITHUB_ENV"

      # Install cross *before* Setup Cache. rust-cache restores cargo's
      # install metadata (.crates2.json) but not the cargo bin directory,
      # so if the cache runs first, binstall sees cross as "already
      # installed", skips it, and the binary is never materialised. Running
      # the install against a clean CARGO_HOME (with --force) guarantees the
      # binary actually exists.
      - name: Install Cross
        if: matrix.builder == 'cross'
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm --force cross
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      # cross runs the compiler inside a container, so the aarch64 libvosk we
      # just downloaded on the host has to be bind-mounted at the same absolute
      # path and the linker environment forwarded in. The container also needs
      # the arm64 ALSA headers for cpal's alsa-sys build script, which is what
      # the pre-build hook installs.
      - name: Configure Cross
        if: matrix.builder == 'cross'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CROSS_CONTAINER_OPTS=-v ${VOSK_LIB_DIR}:${VOSK_LIB_DIR}"
            echo "CROSS_BUILD_ENV_PASSTHROUGH=LIBRARY_PATH LD_LIBRARY_PATH PKG_CONFIG_ALLOW_CROSS PKG_CONFIG_PATH"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig"
          } >> "$GITHUB_ENV"
          # $CROSS_DEB_ARCH is defined by cross inside the container, so it must
          # reach the config unexpanded.
          cat >> "$GITHUB_ENV" <<'CROSSENV'
          CROSS_BUILD_PRE_BUILD=dpkg --add-architecture $CROSS_DEB_ARCH && apt-get update && apt-get install --assume-yes --no-install-recommends pkg-config libasound2-dev:$CROSS_DEB_ARCH libudev-dev:$CROSS_DEB_ARCH
          CROSSENV

      - name: Setup Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Fetch Versioned Cargo.toml
        uses: actions/download-artifact@v8
        with:
          name: cargofile

      # -rpath,$ORIGIN makes the binary look for libvosk.so beside itself, which
      # is what lets the release tarball ship the two side by side.
      - name: cargo build
        run: ${{ matrix.builder }} build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C link-args=-Wl,-rpath,$ORIGIN"

      - name: Package release tarball
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/voice-orders" "$staging/"
          cp "${VOSK_LIB_DIR}/libvosk.so" "$staging/"
          chmod +x "$staging/voice-orders"
          tar -czf "voice-orders-${{ matrix.target }}.tar.gz" -C "$staging" voice-orders libvosk.so

      - name: Upload GitHub Release Artifacts
        uses: SierraSoftworks/gh-releases@v1.0.10
        if: github.event_name == 'release'
        with:
          files: "voice-orders-${{ matrix.target }}.tar.gz | voice-orders-${{ matrix.target }}.tar.gz"
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: "true"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: voice-orders-${{ matrix.target }}
          path: voice-orders-${{ matrix.target }}.tar.gz
